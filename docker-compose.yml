# Local development stack (PHASE6_SPEC.md section 10): PostgreSQL, MinIO (S3-compatible), the
# renderer, api and worker. Email links are printed to the api log.
#
# The renderer sits on an `internal` network only (no route to the outside, like the no-egress
# security group in AWS); only the worker shares that network with it.
#
#   docker compose up --build
#   api at http://localhost:8080   MinIO console at http://localhost:9001 (tailor / tailor-secret)
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: tailor
      POSTGRES_PASSWORD: tailor
      POSTGRES_DB: tailor
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tailor -d tailor"]
      interval: 3s
      timeout: 3s
      retries: 20

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: tailor
      MINIO_ROOT_PASSWORD: tailor-secret
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data

  renderer:
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: renderer
    read_only: true
    user: "10001"
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    tmpfs:
      - /scratch:rw,size=512m,uid=10001,gid=10001
      - /tmp:rw,size=64m,uid=10001,gid=10001
    networks: [internal]

  api:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
    environment: &app-env
      DATABASE_URL: jdbc:postgresql://postgres:5432/tailor
      DATABASE_USER: tailor
      DATABASE_PASSWORD: tailor
      S3_ENDPOINT: http://minio:9000
      S3_BUCKET: tailor-files
      AWS_ACCESS_KEY_ID: tailor
      AWS_SECRET_ACCESS_KEY: tailor-secret
      AWS_REGION: us-east-1
      RENDERER_URL: http://renderer:8090
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8080:8080"

  worker:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
    environment:
      <<: *app-env
      APP_ROLE: worker
    depends_on:
      postgres:
        condition: service_healthy
      renderer:
        condition: service_started
    networks: [default, internal]

networks:
  internal:
    internal: true

volumes:
  pgdata:
  miniodata:
