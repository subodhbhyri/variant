app:
  role: api

spring:
  application:
    name: resume-tailor-web
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/tailor}
    username: ${DATABASE_USER:tailor}
    password: ${DATABASE_PASSWORD:tailor}
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    default-property-inclusion: non_null

server:
  port: ${PORT:8080}
  error:
    include-message: never
    include-stacktrace: never

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  api-docs:
    version: openapi_3_1
  writer-with-order-by-keys: true
  swagger-ui:
    enabled: false
