# Single-server production stack (PHASE6_SPEC.md section 10A). The development docker-compose.yml in the repo root
# is separate and unchanged.
#
#   Run it with deploy.sh, which passes the profile and .env files:
#     docker compose -p variant -f deploy/docker-compose.prod.yml --env-file deploy/profiles/standard.env --env-file deploy/.env up -d
#
# Networks:
#   public   - caddy, api, worker. Has a route out (Google sign-in needs api -> Google; the worker calls Anthropic).
#   backend  - api, worker, postgres, renderer. `internal: true`: no route out at all.
# The renderer and postgres are on `backend` only, so neither can reach the internet and neither is reachable from it.
# Nothing is published except Caddy's ports 80 and 443.

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

x-hardened: &hardened
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]

x-app-env: &app-env
  DATABASE_URL: jdbc:postgresql://postgres:5432/tailor
  DATABASE_USER: tailor
  DATABASE_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in deploy/.env}
  APP_ENV: ${APP_ENV:-prod}
  # APP_ORIGIN is only for tests that publish Caddy on other ports (deploy/.env.example does not list it).
  APP_PUBLIC_BASE_URL: ${APP_ORIGIN:-https://${APP_HOST:?set APP_HOST in deploy/.env}}/api
  APP_FRONTEND_URL: ${APP_ORIGIN:-https://${APP_HOST}}
  APP_COOKIE_SECURE: "true"
  APP_MAIL_MODE: ${APP_MAIL_MODE:-off}
  APP_MAIL_FROM: ${APP_MAIL_FROM:-noreply@localhost}
  APP_STORAGE_MODE: filesystem
  APP_STORAGE_DIR: /data/storage
  APP_STORAGE_LINK_SECRET: ${APP_STORAGE_LINK_SECRET:?set APP_STORAGE_LINK_SECRET in deploy/.env}
  GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
  GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
  RENDERER_URL: http://renderer:8090

services:
  caddy:
    image: caddy:2.8-alpine
    restart: unless-stopped
    logging: *logging
    <<: *hardened
    cap_add: [NET_BIND_SERVICE]
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    environment:
      APP_HOST: ${APP_HOST}
    volumes:
      - ${CADDYFILE_PATH:-./Caddyfile}:/etc/caddy/Caddyfile:ro
      - ${SITE_DIR:-./site}:/srv/site:ro
      - caddy_data:/data
      - caddy_config:/config
    mem_limit: 128m
    networks:
      public:
        ipv4_address: 172.30.0.250
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:2019/config/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
    depends_on:
      api:
        condition: service_healthy

  postgres:
    image: postgres:16.4-alpine
    restart: unless-stopped
    logging: *logging
    environment:
      POSTGRES_USER: tailor
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: tailor
    volumes:
      - pgdata:/var/lib/postgresql/data
    mem_limit: ${POSTGRES_MEM:-1g}
    networks: [backend]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tailor -d tailor"]
      interval: 5s
      timeout: 3s
      retries: 20

  renderer:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: renderer
    image: variant-renderer:local
    restart: unless-stopped
    logging: *logging
    <<: *hardened
    read_only: true
    user: "10001"
    environment:
      POOL_SIZE: ${RENDERER_POOL_SIZE:-2}
      JAVA_TOOL_OPTIONS: ${RENDERER_JAVA_OPTS:--Xmx256m}
    tmpfs:
      - /scratch:rw,size=512m,uid=10001,gid=10001
      - /tmp:rw,size=64m,uid=10001,gid=10001
    mem_limit: ${RENDERER_MEM:-3g}
    networks: [backend]
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/8090 && printf \"GET /health HTTP/1.0\\r\\n\\r\\n\" >&3 && head -1 <&3 | grep -q 200'"]
      interval: 20s
      timeout: 10s
      retries: 5
      start_period: 90s

  api:
    build:
      context: ..
      dockerfile: docker/web.Dockerfile
    image: variant-web:local
    restart: unless-stopped
    logging: *logging
    <<: *hardened
    read_only: true
    environment:
      <<: *app-env
      APP_ROLE: api
      JAVA_TOOL_OPTIONS: ${API_JAVA_OPTS:--Xmx600m}
      # Only Caddy (fixed address on `public`) may set X-Forwarded-For / -Proto, so rate limits see the real client.
      SERVER_TOMCAT_REMOTEIP_INTERNAL_PROXIES: 172\.30\.0\.2
    volumes:
      - storage:/data/storage
    tmpfs:
      - /tmp:rw,size=64m,uid=10001,gid=10001
    mem_limit: ${API_MEM:-1g}
    networks: [public, backend]
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/8080 && printf \"GET /healthz HTTP/1.0\\r\\n\\r\\n\" >&3 && head -1 <&3 | grep -q 200'"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 60s

  worker:
    image: variant-web:local
    restart: unless-stopped
    logging: *logging
    <<: *hardened
    read_only: true
    environment:
      <<: *app-env
      APP_ROLE: worker
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      JAVA_TOOL_OPTIONS: ${WORKER_JAVA_OPTS:--Xmx1536m}
    volumes:
      - storage:/data/storage
    tmpfs:
      - /tmp:rw,size=512m,uid=10001,gid=10001
    mem_limit: ${WORKER_MEM:-3g}
    networks: [public, backend]
    depends_on:
      api:
        condition: service_healthy
      renderer:
        condition: service_healthy
    # A worker has no HTTP surface; it is healthy while its JVM is alive (a crash exits the container and
    # `restart: unless-stopped` starts it again; a job whose worker died is re-claimed after its lease expires).
    healthcheck:
      test: ["CMD-SHELL", "grep -q web.jar /proc/1/cmdline"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 60s

networks:
  public:
    ipam:
      config:
        - subnet: 172.30.0.0/24
  backend:
    internal: true

volumes:
  pgdata:
  storage:
  caddy_data:
  caddy_config:
